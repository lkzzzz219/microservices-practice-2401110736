# ============================================================
# CampusTrade 全栈编排：应用 + MySQL 8.4.11
# 使用方式：
#   1. cp .env.example .env   并填写真实密码
#   2. docker compose up -d --build
# 说明：不使用已废弃的 version 字段；应用通过服务名 mysql 连接数据库。
# ============================================================

name: campustrade

services:
  mysql:
    image: mysql:8.4.11
    container_name: campustrade-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-campustrade}
      MYSQL_USER: ${DB_USER:-campustrade}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请先在 .env 中设置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先在 .env 中设置 MYSQL_ROOT_PASSWORD}
    ports:
      # 本机 3306 常被本地 MySQL 占用，映射到 3308 便于需要时从本机排查
      - "3308:3306"
    volumes:
      # 命名数据卷：容器删除重建后数据仍保留（持久化验证的关键）
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - campustrade-net

  app:
    build:
      context: ./monolith
    image: campustrade:week05
    container_name: campustrade-app
    environment:
      # 通过数据库服务名 mysql 访问，不经本机端口
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-campustrade}
      DB_USER: ${DB_USER:-campustrade}
      DB_PASSWORD: ${DB_PASSWORD:?请先在 .env 中设置 DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campustrade-net

volumes:
  mysql-data:

networks:
  campustrade-net:
