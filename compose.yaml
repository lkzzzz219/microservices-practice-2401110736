name: campustrade-microservices
services:
  nacos:
    image: nacos/nacos-server:v3.2.4
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_ADMIN_ENABLE: "true"
      NACOS_AUTH_CONSOLE_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Run python scripts/nacos-admin.py prepare first}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?Missing server identity key}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Missing server identity value}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "127.0.0.1:${NACOS_CONSOLE_PORT:-18080}:8080"
      - "127.0.0.1:${NACOS_SERVER_PORT:-18849}:8848"
      - "127.0.0.1:${NACOS_GRPC_PORT:-19849}:9848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
  users-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: campustrade_users
      MYSQL_USER: users_app
      MYSQL_PASSWORD: ${USERS_DB_PASSWORD:-users_local_week06}
      MYSQL_ROOT_PASSWORD: ${USERS_ROOT_PASSWORD:-users_root_local_week06}
    volumes:
      - users-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  user-service:
    build: ./services/user-service
    image: campustrade/user-service:week09
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Run python scripts/auth-env.py}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Run python scripts/auth-env.py}
      AUTH_USER_HASH: ${AUTH_USER_HASH:?Run python scripts/auth-env.py}
      AUTH_ADMIN_HASH: ${AUTH_ADMIN_HASH:?Run python scripts/auth-env.py}
      DB_URL: jdbc:mysql://users-db:3306/campustrade_users
      DB_USER: users_app
      DB_PASSWORD: ${USERS_DB_PASSWORD:-users_local_week06}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize Nacos administrator first}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  products-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: campustrade_products
      MYSQL_USER: products_app
      MYSQL_PASSWORD: ${PRODUCTS_DB_PASSWORD:-products_local_week06}
      MYSQL_ROOT_PASSWORD: ${PRODUCTS_ROOT_PASSWORD:-products_root_local_week06}
    volumes:
      - products-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  product-service: &product-service
    build: ./services/product-service
    image: campustrade/product-service:week09
    environment: &product-environment
      INSTANCE_ID: product-a
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Run python scripts/auth-env.py}
      DB_URL: jdbc:mysql://products-db:3306/campustrade_products
      DB_USER: products_app
      DB_PASSWORD: ${PRODUCTS_DB_PASSWORD:-products_local_week06}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize Nacos administrator first}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      products-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  product-service-2:
    <<: *product-service
    environment:
      <<: *product-environment
      INSTANCE_ID: product-b
  orders-db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: campustrade_orders
      MYSQL_USER: orders_app
      MYSQL_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_local_week06}
      MYSQL_ROOT_PASSWORD: ${ORDERS_ROOT_PASSWORD:-orders_root_local_week06}
    volumes:
      - orders-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
  order-service:
    build: ./services/order-service
    image: campustrade/order-service:week09
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Run python scripts/auth-env.py}
      DB_URL: jdbc:mysql://orders-db:3306/campustrade_orders
      DB_USER: orders_app
      DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_local_week06}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize Nacos administrator first}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      orders-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  gateway-service:
    build: ./services/gateway-service
    image: campustrade/gateway-service:week09
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    environment:
      # Compose 部署使用这里的路由；application.yml 保留相同的独立启动默认配置。
      SPRING_APPLICATION_JSON: >-
        {"spring":{"cloud":{"gateway":{"server":{"webflux":{"routes":[
          {"id":"users-and-auth","uri":"lb://user-service",
           "predicates":["Path=/api/users,/api/users/**,/api/auth/**,/api/admin/**"],
           "filters":["AddResponseHeader=X-Gateway-Route,user-service"]},
          {"id":"products","uri":"lb://product-service",
           "predicates":["Path=/api/items,/api/items/**"],
           "filters":["AddResponseHeader=X-Gateway-Route,product-service"]},
          {"id":"orders","uri":"lb://order-service",
           "predicates":["Path=/api/orders,/api/orders/**"],
           "filters":["AddResponseHeader=X-Gateway-Route,order-service"]}
        ]}}}}}}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Run python scripts/auth-env.py}
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?Initialize Nacos administrator first}
      NACOS_GROUP: ${NACOS_GROUP:-PERSONAL_GROUP}
      NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
volumes:
  nacos-data:
  nacos-logs:
  users-data:
  products-data:
  orders-data:
