spring:
  cloud:
    loadbalancer:
      cache:
        enabled: false
      retry:
        enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    nacos:
      discovery:
        enabled: false
        register-enabled: false
  datasource:
    url: jdbc:h2:mem:orders;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
clients:
  connect-timeout-ms: 200
  read-timeout-ms: 200
