spring:
  datasource:
    url: jdbc:h2:mem:orders;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
clients:
  user-url: http://127.0.0.1:1
  product-url: http://127.0.0.1:1
  connect-timeout-ms: 200
  read-timeout-ms: 200
