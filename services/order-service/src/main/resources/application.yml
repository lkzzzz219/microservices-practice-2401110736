server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: order-service
  cloud:
    loadbalancer:
      cache:
        enabled: false
      retry:
        enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:PERSONAL_GROUP}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campustrade_orders}
    username: ${DB_USER:orders_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
clients:
  connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:3000}
