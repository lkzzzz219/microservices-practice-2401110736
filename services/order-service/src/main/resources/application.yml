server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campustrade_orders}
    username: ${DB_USER:orders_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
management:
  endpoints:
    web:
      exposure:
        include: health,info
clients:
  user-url: ${USER_SERVICE_URL:http://localhost:8081}
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:3000}
