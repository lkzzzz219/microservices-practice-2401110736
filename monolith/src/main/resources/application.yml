spring:
  application:
    name: campustrade-monolith
  # 数据库连接：密码通过环境变量 DB_PASSWORD 传入，不要写进配置文件
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campustrade}
    username: ${DB_USER:campustrade}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # 仅用于本地开发；表结构设计见根目录 docs/database.md

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    diskspace:
      # 部分容器/挂载文件系统会报告 0 可用空间导致误报 DOWN，
      # 故关闭磁盘空间检查，保证健康检查只反映应用自身运行状态。
      enabled: false
