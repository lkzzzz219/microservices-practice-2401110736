spring:
  application:
    name: campustrade-monolith

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    diskspace:
      # 本周尚无磁盘持久化需求；部分容器/挂载文件系统会报告 0 可用空间导致误报 DOWN，
      # 故关闭磁盘空间检查，保证健康检查只反映应用自身运行状态。
      enabled: false
